# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Create and publish a container image

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

# Two merges in quick succession would otherwise work out the same release
# number twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag a release
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-tags: true # to work out the next release number

      # Everything that lands on master is a release: consumers pin a version,
      # so a fix that is only on master reaches nobody. The tag is the vale
      # version in the Dockerfile, with .1, .2 and so on when that release
      # exists already and only the image around vale has changed.
      - name: Work out the release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          vale_version="$(awk -F '=' '/VALE_VERSION=/{print $2}' Dockerfile)"
          tag="${vale_version}"
          revision=0
          while git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; do
            revision=$((revision + 1))
            tag="${vale_version}.${revision}"
          done
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@ba754150c9dbbaa912ae0ac3cfba43f84195cef2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A build that succeeds proves only that the files were copied. Run vale
      # on every platform we publish, so a binary that cannot execute there is
      # caught here instead of on someone's laptop.
      - name: Run the image on every published platform
        run: |
          # A tag, not the digest the build step reports: that digest names
          # the multi-platform index, and docker run refuses --platform
          # together with a digest.
          image="$(echo "${TAGS}" | head -n1)"
          for platform in linux/amd64 linux/arm64; do
            echo "::group::${platform}"
            docker run --rm --platform "${platform}" "${image}" --version
            docker run --rm --platform "${platform}" --entrypoint vale "${image}" ls-config > /dev/null
            echo "::endgroup::"
          done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      # Add the release tags to the image the previous step just ran, rather
      # than building again, so nothing reaches a version tag untested.
      - name: Publish the release
        if: steps.release.outputs.tag != ''
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${TAG}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "$(echo "${TAGS}" | head -n1)"
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Tag the release
        if: steps.release.outputs.tag != ''
        run: |
          ms_style_version="$(awk -F '=' '/MS_STYLE_VERSION=/{print $2}' Dockerfile)"
          openly_style_version="$(awk -F '=' '/OPENLY_STYLE_VERSION=/{print $2}' Dockerfile)"
          vale_version="$(awk -F '=' '/VALE_VERSION=/{print $2}' Dockerfile)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}

          - vale: ${vale_version}
          - Microsoft style: ${ms_style_version}
          - Openly style: ${openly_style_version}
          "
          git push origin "${TAG}"
        env:
          TAG: ${{ steps.release.outputs.tag }}
